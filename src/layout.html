<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>{{title}}</title>
<meta name="description" content="{{desc}}" />
<link rel="canonical" href="{{canonical}}" />
<meta property="og:title" content="{{title}}" />
<meta property="og:description" content="{{desc}}" />
<meta property="og:type" content="website" />
<meta property="og:url" content="{{canonical}}" />
<meta name="theme-color" content="#060406" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23060406'/%3E%3Cpath d='M17.6 4 9 18h5.4L13 28l9.4-15H16.8z' fill='%23ff5d8a'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<!-- The lit plate and the grain, lifted from the extension's own Recall page so
     the site and the product are recognisably one thing. Both are decoration
     and are hidden from the reader that cannot see them. -->
<div class="field" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="shell">
  <a class="skip" href="#main">Skip to content</a>

  <header>
    <a class="brand" href="/">
      <span class="mark" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 32 32"><path d="M17.6 4 9 18h5.4L13 28l9.4-15H16.8z" fill="currentColor"/></svg>
      </span>
      <span class="brand-name">Tvara</span>
    </a>
    <nav aria-label="Primary">{{nav}}</nav>
  </header>

  <main id="main">
{{body}}
  </main>

  <footer>
    <div class="foot-row">
      <span>Tvara · {{year}}</span>
      <span class="foot-links">
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms &amp; refunds</a>
        <a href="mailto:{{mail}}">{{mail}}</a>
      </span>
    </div>
    <p class="foot-note">An independent product. Not affiliated with or endorsed by OpenAI, Anthropic, Google, Perplexity, DeepSeek or xAI. All product names belong to their owners.</p>
  </footer>
</div>

<script>
/* Deep links from every extension build shipped so far point at anchors on a
   one-page site: /#privacy, /#terms, /#faq, /#devices. They are still handed
   out by copies already installed, so this sends them to the page that now
   holds that section instead of dropping them on the home page. */
(function () {
  var moved = { "#privacy": "/privacy", "#terms": "/terms", "#refunds": "/terms#refunds",
                "#faq": "/faq", "#devices": "/pricing#devices", "#features": "/features",
                "#pricing": "/pricing", "#buy": "/pricing" };
  var to = moved[location.hash];
  if (to && location.pathname === "/") location.replace(to);
})();
</script>
</body>
</html>
