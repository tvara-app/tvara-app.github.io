# The site is static and lives on Cloudflare Pages: files served from the edge,
# no Worker invoked, nothing metered. Response headers come from dist/_headers,
# not from code, so there is no script to run and nothing to bill.
name = "tvara"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-30"

# The custom domain is attached to the Pages project, not routed here:
#   node tools/attach-domain.mjs tvara.app
